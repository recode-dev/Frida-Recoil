name: RecoilGear
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: recode-dev/Recoil-Plus
          path: Recoil-Plus

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-nm-${{ hashFiles('**/package-lock.json', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-nm-

      - name: Cache built bytecode
        id: cache-script
        uses: actions/cache@v4
        with:
          path: script_69_252.js
          key: ${{ runner.os }}-script-${{ hashFiles('Recoil-Plus/src/**') }}
          restore-keys: |
            ${{ runner.os }}-script-

      - name: Install dependencies
        if: steps.cache-script.outputs.cache-hit != 'true'
        run: |
          npm install frida@17.2.11 @reversense/dexcalibur-frida-compile
          npm install --no-save babelify @babel/core @babel/preset-env

      - name: Build bytecode
        if: steps.cache-script.outputs.cache-hit != 'true'
        run: |
          cat > Recoil-Plus/agent/package.json <<'EOF'
          {
            "type": "module",
            "browserify": {
              "transform": [
                ["babelify", {
                  "presets": ["@babel/preset-env"],
                  "sourceType": "module"
                }]
              ]
            }
          }
          EOF
          npx frida-compile Recoil-Plus/src/index.js -o script_69_252.js -b

      - uses: actions/upload-artifact@v7
        with:
          name: RecoilGear-bytecode
          path: script_69_252.js
          retention-days: 30