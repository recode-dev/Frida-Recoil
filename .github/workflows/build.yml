name: RecoilGear

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: recode-dev/RecoilGear
          path: RecoilGear

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('RecoilGear/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache built bytecode
        id: cache-script
        uses: actions/cache@v4
        with:
          path: script_69_252.js
          key: ${{ runner.os }}-script-${{ hashFiles('RecoilGear/src/**', 'RecoilGear/tsconfig.json', 'RecoilGear/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-script-

      - name: Install dependencies
        if: steps.cache-script.outputs.cache-hit != 'true'
        working-directory: RecoilGear
        run: |
          npm ci
          npm install --no-save frida@17.2.11

      - name: Type check
        if: steps.cache-script.outputs.cache-hit != 'true'
        working-directory: RecoilGear
        run: npx tsc --noEmit

      - name: Build bytecode
        if: steps.cache-script.outputs.cache-hit != 'true'
        working-directory: RecoilGear
        run: |
          npx frida-compile src/Index.ts -B iife -o build/agent.js
          node --input-type=commonjs -e "const fs=require('fs'),frida=require('frida');(async()=>{const s=await frida.attach(0);const b=await s.compileScript(fs.readFileSync('build/agent.js','utf8'));fs.writeFileSync('../script_69_252.js',b);console.log('bytecode:',b.length,'bytes');})().catch(e=>{console.error(e);process.exit(1)})"

      - uses: actions/upload-artifact@v4
        with:
          name: RecoilGear-bytecode
          path: script_69_252.js
          retention-days: 30