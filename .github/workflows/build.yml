name: Build RecoilGear (Bytecode)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RecoilGear source
        uses: actions/checkout@v4
        with:
          repository: recode-dev/RecoilGear
          path: RecoilGear

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frida-compile (для сборки бандла)
        run: npm install -g frida-compile@19.0.5

      - name: Install frida (для компиляции в байткод)
        run: npm install -g frida@17.2.11

      - name: Bundle RecoilGear.js (без -b)
        run: frida-compile RecoilGear/agent/index.js -o RecoilGear.bundle.js

      - name: Compile to QuickJS bytecode
        run: |
          node -e "
          const fs = require('fs');
          const frida = require('frida');
          (async () => {
            const source = fs.readFileSync('RecoilGear.bundle.js', 'utf8');
            const bytecode = await frida.compileScript(source, { runtime: 'qjs' });
            fs.writeFileSync('RecoilGear.js', bytecode);
            console.log('Bytecode size:', bytecode.length, 'bytes');
          })().catch(e => { console.error(e); process.exit(1); });
          "

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecoilGear-bytecode
          path: RecoilGear.js
          retention-days: 30