name: Build RecoilGear (Bytecode)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: recode-dev/RecoilGear
          path: RecoilGear

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install frida@17.2.11 @reversense/dexcalibur-frida-compile
          npm install --no-save babelify @babel/core @babel/preset-env

      - name: Build bytecode
        run: |
          cat > RecoilGear/agent/package.json <<'EOF'
          {
            "type": "module",
            "browserify": {
              "transform": [
                ["babelify", {
                  "presets": ["@babel/preset-env"],
                  "sourceType": "module"
                }]
              ]
            }
          }
          EOF
          npx frida-compile RecoilGear/agent/index.js -o RecoilGear.js -b

      - uses: actions/upload-artifact@v4
        with:
          name: RecoilGear-bytecode
          path: script_69_252.js
          retention-days: 30