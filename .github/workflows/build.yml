name: Build RecoilGear (Bytecode)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RecoilGear source
        uses: actions/checkout@v4
        with:
          repository: recode-dev/RecoilGear
          path: RecoilGear

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frida (runtime for bytecode)
        run: npm install -g frida@17.2.11

      - name: Install frida-compile
        run: npm install -g frida-compile@19.0.5

      - name: Build RecoilGear.js (bytecode)
        run: frida-compile RecoilGear/agent/index.js -o RecoilGear.js -b

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecoilGear-bytecode
          path: script_69_252.js
          retention-days: 30