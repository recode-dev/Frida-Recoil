name: Build RecoilGear

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: recode-dev/RecoilGear
          path: RecoilGear

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install frida@17.2.11
          npm install @reversense/dxc-frida-compile

      - name: Build bytecode (programmatic API)
        run: |
          node -e "
          const compiler = require('@reversense/dxc-frida-compile');
          (async () => {
            await compiler.build('RecoilGear/agent/index.js', 'RecoilGear.js', {
              bytecode: true,
              compress: false
            });
            console.log('Build OK');
          })().catch(e => { console.error(e); process.exit(1); });
          "

      - uses: actions/upload-artifact@v4
        with:
          name: RecoilGear-bytecode
          path: RecoilGear.js
          retention-days: 30