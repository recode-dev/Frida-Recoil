name: Build RecoilGear (Bytecode)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: recode-dev/RecoilGear
          path: RecoilGear

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install frida@17.2.11 @reversense/dexcalibur-frida-compile

      - name: Build bytecode
        run: |
          npx frida-compile RecoilGear/agent/index.js -o RecoilGear.js -b

      - uses: actions/upload-artifact@v4
        with:
          name: RecoilGear-bytecode
          path: RecoilGear.js
          retention-days: 30