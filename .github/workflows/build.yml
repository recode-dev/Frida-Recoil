name: Build RecoilGear

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RecoilGear source
        uses: actions/checkout@v4
        with:
          repository: recode-dev/RecoilGear
          path: RecoilGear

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frida-compile
        run: npm install -g frida-compile

      - name: Build RecoilGear.js
        run: frida-compile RecoilGear/agent/index.js -o RecoilGear.js -c

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecoilGear
          path: RecoilGear.js
          retention-days: 30